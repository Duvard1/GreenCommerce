name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - develop
    paths:
      - 'Frontend/green-commerce/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/greencommerce-frontend:lastest ./Frontend/green-commerce
          docker push ${{ secrets.DOCKER_USERNAME }}/greencommerce-frontend:lastest

      - name: SSH and Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEYPAIR }}
          port: 22
          script: |

            sudo docker stop greencommerce-frontend || true
            sudo docker rm greencommerce-frontend || true

            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/greencommerce-frontend:lastest || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/greencommerce-frontend:lastest

            cd /home/ubuntu

            echo "NEXT_PUBLIC_API_REGISTER_URL=${{ secrets.NEXT_PUBLIC_API_REGISTER_URL }}" > .env
            echo "NEXT_PUBLIC_API_LOGIN_URL=${{ secrets.NEXT_PUBLIC_API_LOGIN_URL }}" >> .env
            echo "NEXT_PUBLIC_API_USER_URL=${{ secrets.NEXT_PUBLIC_API_USER_URL }}" >> .env
            echo "NEXT_PUBLIC_API_PROFILE_URL=${{ secrets.NEXT_PUBLIC_API_PROFILE_URL }}" >> .env
            echo "NEXT_PUBLIC_API_DELETE_URL=${{ secrets.NEXT_PUBLIC_API_DELETE_URL }}" >> .env
            echo "NEXT_PUBLIC_API_PRODUCT_URL=${{ secrets.NEXT_PUBLIC_API_PRODUCT_URL }}" >> .env
            echo "NEXT_PUBLIC_API_GRAPHQL_URL=${{ secrets.NEXT_PUBLIC_API_GRAPHQL_URL }}" >> .env

            if [ ! -s .env ]; then
              echo "ERROR: .env is empty or was not created correctly"
              exit 1
            fi

            sudo docker run -d --env-file .env -p 80:3000 --name greencommerce-frontend ${{ secrets.DOCKER_USERNAME }}/greencommerce-frontend:lastest
